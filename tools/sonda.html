<!doctype html>
<html><body><pre id="s">…</pre>
<script>
const s = document.getElementById("s");
const c = document.createElement("canvas"); c.width = 64; c.height = 64;
const x = c.getContext("2d"); x.fillStyle = "#f00"; x.fillRect(0, 0, 64, 64);
const d = c.toDataURL("image/webp");
s.textContent = "dataURL: " + d.slice(0, 24) + " len=" + d.length;
(async () => {
  try {
    const oc = new OffscreenCanvas(64, 64);
    const ox = oc.getContext("2d"); ox.fillStyle = "#0f0"; ox.fillRect(0, 0, 64, 64);
    const b = await oc.convertToBlob({ type: "image/webp", quality: 0.8 });
    s.textContent += "\noffscreen: " + b.type + " " + b.size;
  } catch (e) { s.textContent += "\noffscreen ERROR " + e.message; }
})();
</script></body></html>
